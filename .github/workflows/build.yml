name: build

on:
  # One choice by hand. Not offered, because they did nothing useful here: a clean rebuild
  # (every run starts from a freshly cloned tree with no .config, so the build script skips it),
  # images as a workflow artifact (public to anyone signed in, while the draft keeps them
  # private), and compiling the cw-opt feed (the feed workflow does that, and publishes it).
  workflow_dispatch:
    inputs:
      draft:
        description: "Put the images in the private draft release v<CW_VERSION> (needs the signing secrets and a live cw-opt feed); untick for a test build"
        type: boolean
        default: true
  # The feed workflow runs this same build with opt_artifacts on and publishes the feed it makes.
  workflow_call:
    inputs:
      opt_artifacts:
        type: boolean
        default: false
      draft:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

env:
  CW_MAX_IMAGE_MB: "130"

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # Build once, promote: a build with `draft` on puts its images in the private draft release
    # v<CW_VERSION>, and the release workflow publishes exactly those files - nothing is rebuilt
    # for a release. A draft and not a workflow artifact: an artifact of a public repository is
    # downloadable by anyone signed in, a draft only by the repository's collaborators.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: ver
        run: |
          ver=$(sed -n 's/^CW_VERSION="\(.*\)"$/\1/p' tools/cw-release-build.sh)
          tag=$(sed -n 's/^OPENWRT_TAG="\(.*\)"$/\1/p' tools/cw-release-build.sh)
          {
            echo "version=$ver"
            echo "tag=$tag"
            echo "draft=${{ inputs.draft && 'true' || 'false' }}"
          } >> "$GITHUB_OUTPUT"

      # A draft is checked before the two-hour build, not after it: it needs the signing keys
      # (an unsigned image fails the router's signature check on sysupgrade, and a throw-away
      # apk key signs a feed no router trusts), a changelog section for its notes, a version
      # that is not released yet, and a live cw-opt feed: the image lists it, and a dead feed
      # entry breaks `apk update` on every router.
      - name: Release checks
        if: steps.ver.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          HAVE_APK: ${{ secrets.APK_PRIVATE_KEY != '' }}
          HAVE_USIGN: ${{ secrets.USIGN_KEY_BUILD != '' && secrets.USIGN_KEY_BUILD_PUB != '' }}
        run: |
          set -eu
          bad=0
          [ "$HAVE_USIGN" = true ] || { echo "::error::a release needs the USIGN_KEY_BUILD and USIGN_KEY_BUILD_PUB secrets (image signing)"; bad=1; }
          [ "$HAVE_APK" = true ] || { echo "::error::a release needs the APK_PRIVATE_KEY secret (the package key routers trust)"; bad=1; }
          # the section must exist and hold at least one entry: the release workflow opens an
          # empty one for the next label, and the draft's notes are made from it
          entries=$(awk -v v="$VERSION" '
            /^## / { if (on) exit; if (index($0, "## " v) == 1 && (length($0) == length(v) + 3 || substr($0, length(v) + 4, 1) == " ")) { on = 1; f = 1; next } }
            on && /^[-*] / { n++ }
            END { print (f ? n + 0 : -1) }' docs/changelog.md)
          case "$entries" in
            -1) echo "::error::docs/changelog.md has no '## $VERSION' section for the release notes"; bad=1 ;;
            0)  echo "::error::the '## $VERSION' section of docs/changelog.md is empty - add what changed"; bad=1 ;;
          esac
          tag="v$VERSION"
          if gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null | grep -qx false; then
            echo "::error::$tag is published already. The release workflow moves main to the next label by itself; for a release published without it, run tools/cw-bump-version.sh --released $VERSION and push"; bad=1
          fi
          # a tag that exists already decides the commit the release publishes; it must be this one
          at=$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" | awk '{c=$1} END{print c}')
          if [ -n "$at" ] && [ "$at" != "$GITHUB_SHA" ]; then
            echo "::error::tag $tag exists at $at, not at this commit $GITHUB_SHA - run tools/cw-bump-version.sh --released $VERSION and push, or delete the tag"; bad=1
          fi
          list=files/etc/apk/repositories.d/cw-opt.list
          if [ -f "$list" ]; then
            url=$(grep -v '^#' "$list" | grep -m1 .)
            curl -sSfI --max-time 30 "$url" > /dev/null ||
              { echo "::error::the cw-opt feed ($url) does not answer: run the feed workflow first"; bad=1; }
          fi
          exit "$bad"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          sudo mkdir -p /mnt/cw && sudo chown "$USER" /mnt/cw
          df -h / /mnt

      - name: Builder image
        run: docker build -t cleanwrt-builder docker/

      - name: OpenWrt tree at the pinned tag
        run: |
          tag=$(sed -n 's/^OPENWRT_TAG="\(.*\)"$/\1/p' tools/cw-release-build.sh)
          git clone --depth 1 --branch "$tag" https://github.com/openwrt/openwrt.git /mnt/cw/openwrt

      - name: Restore caches
        uses: actions/cache/restore@v6
        with:
          path: |
            /mnt/cw/openwrt/dl
            /mnt/cw/openwrt/.ccache
            /mnt/cw/openwrt/tmp/go-build
          # tmp/go-build is Go's build cache (GOCACHE in golang-package.mk): ccache does not see Go,
          # so without it every Go package (mihomo, tailscale, cloudflared, syncthing, yq, ...)
          # compiles from nothing on every run. Go keys entries by content and trims unused ones.
          # The tree tag is part of the key: a compiler cache built against another OpenWrt
          # release is not a cache for this one, and no cache is cheaper than a wrong one.
          key: cw-${{ steps.ver.outputs.tag }}-${{ hashFiles('feeds.conf.default', 'configs/**') }}-${{ github.run_id }}
          # The second key falls back to any cache of the same tree tag. A seed or feed-pin
          # change used to start cold (no dl/, no ccache). ccache keys every entry on the
          # compiler, flags and preprocessed source, so a stale entry is a miss, never a
          # wrong object. dl/ files are checked against their PKG_HASH.
          restore-keys: |
            cw-${{ steps.ver.outputs.tag }}-${{ hashFiles('feeds.conf.default', 'configs/**') }}-
            cw-${{ steps.ver.outputs.tag }}-

      # Host tools and the cross toolchain: about an hour of every cold run (gcc twice, cmake,
      # binutils, ...), and they change only with the OpenWrt tag, the builder image or the
      # toolchain options. The key is built from exactly those, so a package change in the seed
      # keeps the cache. Exact match only - no fallback - because a toolchain built with other
      # options is not this toolchain.
      - name: Toolchain cache key
        id: tckey
        run: |
          opts=$( { grep -E '^(# )?CONFIG_(TOOLCHAINOPTS|GDB|GCC_|BINUTILS_|LIBC_|DEVEL|CCACHE|TARGET_)' configs/arcadyan_aw1000.seed; cat docker/Dockerfile; } | sha256sum | cut -c1-16)
          echo "key=cw-tc-${{ steps.ver.outputs.tag }}-$opts" >> "$GITHUB_OUTPUT"

      - name: Restore toolchain cache
        id: tc
        uses: actions/cache/restore@v6
        with:
          path: |
            /mnt/cw/openwrt/staging_dir/host
            /mnt/cw/openwrt/staging_dir/toolchain-*
          key: ${{ steps.tckey.outputs.key }}

      # The tree was cloned a minute ago, so every source file is newer than the restored
      # "built" stamps and OpenWrt would rebuild every tool anyway. Touching the stamps after
      # the clone tells it the restored tools are current (the cachewrtbuild method).
      - name: Mark the restored toolchain current
        if: steps.tc.outputs.cache-hit == 'true'
        run: |
          cd /mnt/cw/openwrt
          find staging_dir/host staging_dir/toolchain-* -type d -name stamp | while read -r d; do
            find "$d" -type f -exec touch {} +
          done
          echo "toolchain restored: $(du -sh staging_dir/host staging_dir/toolchain-* | tr '\n' ' ')"

      - name: Signing keys (optional repository secrets)
        env:
          APK_PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
          USIGN_KEY_BUILD: ${{ secrets.USIGN_KEY_BUILD }}
          USIGN_KEY_BUILD_PUB: ${{ secrets.USIGN_KEY_BUILD_PUB }}
        run: |
          set -eu
          if [ -n "$APK_PRIVATE_KEY" ]; then
            umask 077
            printf '%s\n' "$APK_PRIVATE_KEY" > /mnt/cw/openwrt/private-key.pem
            echo "apk feed signing key: restored from secret"
          else
            echo "apk feed signing key: none (the tree creates a throw-away key; the cw-opt feed stays disabled)"
          fi
          if [ -n "$USIGN_KEY_BUILD" ] && [ -n "$USIGN_KEY_BUILD_PUB" ]; then
            umask 077
            mkdir -p keys-release
            printf '%s\n' "$USIGN_KEY_BUILD" > keys-release/key-build
            printf '%s\n' "$USIGN_KEY_BUILD_PUB" > keys-release/key-build.pub
            echo "image signing key: restored from secret"
          else
            echo "image signing key: none (images are not signed)"
          fi

      - name: Build
        id: build
        timeout-minutes: 335
        env:
          CW_CCACHE: "1"
          CW_BUILD_OPT_ARTIFACTS: ${{ inputs.opt_artifacts && '1' || '0' }}
          CW_REQUIRE_RELEASE_KEYS: ${{ ((inputs.opt_artifacts && secrets.APK_PRIVATE_KEY != '') || steps.ver.outputs.draft == 'true') && '1' || '0' }}
        run: |
          set -o pipefail
          # Progress lines in this log (">> progress: compile [####....] 40% ..."), read from the
          # build log by a watcher beside the build: at each phase, every 5%, and every 10 minutes.
          # Its total is the last finished run's count, kept in the cached dl/ directory; sudo
          # because the build's container leaves dl/ owned by root. It only reads, and it is
          # stopped when the build ends, whatever the build's result.
          : > /mnt/cw/build.log
          sudo env CW_PROGRESS_TOTAL_FILE=/mnt/cw/openwrt/dl/.cw-progress-total \
            sh tools/cw-build-progress.sh --plain /mnt/cw/build.log /mnt/cw/openwrt &
          progress=$!
          rc=0
          docker run --rm \
            -e CW_CCACHE -e CW_BUILD_OPT_ARTIFACTS -e CW_REQUIRE_RELEASE_KEYS -e CW_MAX_IMAGE_MB \
            -v /mnt/cw/openwrt:/build -v "$PWD":/cleanwrt \
            cleanwrt-builder /cleanwrt/tools/cw-release-build.sh /build 2>&1 | tee -a /mnt/cw/build.log || rc=$?
          # one last pass so the final line is printed, then stop the watcher
          sleep 20
          sudo kill "$progress" 2>/dev/null || true
          wait "$progress" 2>/dev/null || true
          exit "$rc"

      - name: Compiler cache statistics
        if: always()
        run: |
          if [ -x /mnt/cw/openwrt/staging_dir/host/bin/ccache ]; then
            CCACHE_DIR=/mnt/cw/openwrt/.ccache /mnt/cw/openwrt/staging_dir/host/bin/ccache -s
          fi
          du -sh /mnt/cw/openwrt/dl /mnt/cw/openwrt/.ccache /mnt/cw/openwrt/tmp/go-build 2>/dev/null || true
          df -h /mnt

      - name: Save caches
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            /mnt/cw/openwrt/dl
            /mnt/cw/openwrt/.ccache
            /mnt/cw/openwrt/tmp/go-build
          key: cw-${{ steps.ver.outputs.tag }}-${{ hashFiles('feeds.conf.default', 'configs/**') }}-${{ github.run_id }}

      - name: Save toolchain cache
        if: success() && steps.tc.outputs.cache-hit != 'true'
        run: |
          # the build ran as root in the container; the cache action runs as the runner user
          sudo chown -R "$USER" /mnt/cw/openwrt/staging_dir/host /mnt/cw/openwrt/staging_dir/toolchain-*

      - name: Upload toolchain cache
        if: success() && steps.tc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            /mnt/cw/openwrt/staging_dir/host
            /mnt/cw/openwrt/staging_dir/toolchain-*
          key: ${{ steps.tckey.outputs.key }}

      - name: Collect release files
        if: success()
        run: |
          set -eu
          OUT=/mnt/cw/openwrt/bin/targets/qualcommax/ipq807x
          mkdir -p dist
          find "$OUT" -maxdepth 1 -type f \
            \( -name '*arcadyan_aw1000*' -o -name '*.manifest' -o -name 'profiles.json' \
               -o -name 'sha256sums*' -o -name '*.buildinfo' \) -exec cp {} dist/ \;
          cp -r "$OUT/cw-release-provenance" dist/cw-release-provenance
          tar -C dist -czf dist/provenance.tar.gz cw-release-provenance && rm -rf dist/cw-release-provenance
          # sha256sums.cw names the paths inside the bundle. A bundle that unpacks under a
          # different directory cannot be verified with it, so the two are proved to agree
          # here, before anything reaches the release page.
          chk=$(mktemp -d)
          tar -xzf dist/provenance.tar.gz -C "$chk"
          grep 'cw-release-provenance' dist/sha256sums.cw > "$chk/provenance-only.txt"
          ( cd "$chk" && sha256sum -c provenance-only.txt ) || { echo "ERROR: sha256sums.cw does not match the provenance bundle" >&2; rm -rf "$chk"; exit 1; }
          rm -rf "$chk"
          ls -l dist
          # every image the release page promises must actually be in dist/
          for pat in '*arcadyan_aw1000-squashfs-sysupgrade.bin' \
                     '*arcadyan_aw1000-squashfs-factory.ubi' \
                     '*arcadyan_aw1000-initramfs-uImage.itb'; do
              compgen -G "dist/$pat" > /dev/null || { echo "ERROR: no file matches $pat" >&2; exit 1; }
          done
          # The image signing key's public half goes with the images, so anyone can check a
          # signature against the key the release was signed with.
          if [ -s keys-release/key-build.pub ]; then cp keys-release/key-build.pub dist/key-build.pub; fi
          # The three image hashes in the log: two runs of one commit can be compared from the
          # summary alone, with nothing downloaded.
          sha256sum dist/*.bin dist/*.ubi dist/*.itb

      - name: Optional cw-opt feed
        if: success() && inputs.opt_artifacts
        run: |
          docker run --rm -v /mnt/cw/openwrt:/build -v "$PWD":/cleanwrt cleanwrt-builder \
            /cleanwrt/tools/cw-publish-feed.sh /build --out /cleanwrt/feed-out
          tar -C feed-out -czf dist/cw-opt-feed.tar.gz .

      # The verified feed for the feed workflow's publish job. Public like the feed it becomes.
      - name: Upload the cw-opt feed
        if: success() && inputs.opt_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cw-opt-feed
          path: feed-out/
          retention-days: 3
          if-no-files-found: error

      # The draft is the holding area: private, kept until deleted, and what the release
      # workflow publishes. Each build of a version refreshes it; a published release is never
      # touched (the site and the routers' upgrade notice point at those bytes).
      - name: Draft release
        if: success() && steps.ver.outputs.draft == 'true'
        env:
          # The workflow token, unless the repository has a RELEASE_TOKEN secret: a fine-grained
          # personal token with "Contents: Read and write" on this repository only. That is the way
          # round a repository whose settings or rules refuse the workflow token releases
          # ("HTTP 403: Resource not accessible by integration"). docs/fork-maintenance.md.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          tag="v$VERSION"
          # The sysupgrade image must carry a valid signature by the release key: this is the
          # verification the router itself runs (/lib/upgrade/fwtool.sh, fwtool_check_signature),
          # against keys-release/key-build.pub. Proving only that some signature is attached is
          # not enough: an image with a certificate but no signature passes that.
          # fwtool, ucert and usign are the tree's host builds, run in the builder image they were
          # compiled in; ucert calls usign by name, hence the PATH.
          for img in dist/*-squashfs-sysupgrade.bin; do
            docker run --rm -v /mnt/cw/openwrt:/build:ro -v "$PWD/dist":/dist:ro -v "$PWD/keys-release":/keys:ro cleanwrt-builder \
              sh -ec '
                export PATH=/build/staging_dir/host/bin:$PATH
                k=$(mktemp -d); c=$(mktemp)
                cp /keys/key-build.pub "$k/$(usign -F -p /keys/key-build.pub)"
                fwtool -q -s "$c" "/dist/$1"
                fwtool -q -T -s /dev/null "/dist/$1" | ucert -V -q -m - -c "$c" -P "$k"
              ' _ "$(basename "$img")" ||
              { echo "ERROR: $img has no valid signature by keys-release/key-build.pub - check the USIGN_KEY_BUILD secrets" >&2; exit 1; }
            echo "signature verified: $img"
          done
          # What changed: the docs/changelog.md section of this version, minus its heading.
          # Links between doc pages are relative there; on the release page they point at the site.
          site="https://shanelkapramuditha.github.io/cleanwrt-aw1000-ng/docs"
          awk -v v="$VERSION" '
            $0 ~ "^## " { if (on) exit; if (index($0, "## " v) == 1 && (length($0) == length(v) + 3 || substr($0, length(v) + 4, 1) == " ")) { on = 1; next } }
            on' docs/changelog.md |
            sed -E "s#\]\(([a-z0-9/_-]+)\.md(\#[^)]*)?\)#](${site}/\1/\2)#g" > changes.md
          [ -s changes.md ] || { echo "ERROR: docs/changelog.md has no section for $VERSION" >&2; exit 1; }
          # Size, so creep shows release by release: the sysupgrade image, the change since the
          # newest published release (its asset of the same kind), and the flash blocks the build's
          # UBI check counted. Each part is left out when it cannot be read; none fails the build.
          img=$(ls dist/*-squashfs-sysupgrade.bin | head -1)
          bytes=$(stat -c %s "$img")
          mib() { awk -v b="$1" 'BEGIN { printf "%.1f", b / 1048576 }'; }
          size="**Size:** sysupgrade image $(mib "$bytes") MiB"
          prev=$(gh release list --exclude-drafts --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
          if [ -n "$prev" ] && [ "$prev" != "$tag" ]; then
            pbytes=$(gh release view "$prev" --json assets \
              -q '.assets[] | select(.name | endswith("-squashfs-sysupgrade.bin")) | .size' 2>/dev/null | head -1)
            if [ -n "$pbytes" ]; then
              d=$((bytes - pbytes)); sign=+; [ "$d" -lt 0 ] && { sign=-; d=$((-d)); }
              size="$size ($sign$(mib "$d") MiB since $prev)"
            fi
          fi
          pebs=$(sed -n 's/^UBI_PEBS volumes need \([0-9]*\) PEBs.*capacity \([0-9]*\)).*/\1 of \2/p' /mnt/cw/build.log 2>/dev/null | tail -1)
          [ -n "$pebs" ] && size="$size; $pebs flash blocks of the expanded layout"
          {
            echo "CleanWRT $VERSION for the Arcadyan AW1000 (OpenWrt ${{ steps.ver.outputs.tag }}, qualcommax/ipq807x)."
            echo
            echo "## What's new"
            cat changes.md
            echo
            echo "## Files"
            echo
            echo "$size."
            echo
            echo "Flash the \`*-squashfs-sysupgrade.bin\` with sysupgrade; read [the flash layout page](${site}/mtd-layout/)"
            echo "first, the image needs the expanded MTD layout. \`sha256sums.cw\` lists the checksums of the images and"
            echo "the provenance bundle; \`provenance.tar.gz\` holds the full config, the pinned feeds and"
            echo "the package manifest of this build. \`key-build.pub\` is the public key the images are"
            echo "signed with; a router that has \`ucert\` installed checks it before sysupgrade. Built from"
            echo "commit $GITHUB_SHA."
          } > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            [ "$(gh release view "$tag" --json isDraft -q .isDraft)" = "true" ] ||
              { echo "ERROR: $tag is published already; a build never rewrites it - bump CW_VERSION" >&2; exit 1; }
            # the draft holds this build's files and nothing else: a file an earlier build left
            # under another name goes, the rest are replaced
            gh release view "$tag" --json assets -q '.assets[].name' | while read -r a; do
              [ -e "dist/$a" ] || { echo "removing stale asset $a"; gh release delete-asset "$tag" "$a" --yes; }
            done
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --target "$GITHUB_SHA" --notes-file notes.md
          else
            gh release create "$tag" dist/* --draft --target "$GITHUB_SHA" --title "CleanWRT $VERSION" --notes-file notes.md
          fi
          {
            echo "### Draft $tag refreshed"
            echo "Built from \`$GITHUB_SHA\`. Test the images from the draft, then publish them with"
            echo "**Actions → release → Run workflow**."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "draft $tag: $(gh release view "$tag" --json url -q .url)"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: /mnt/cw/build.log
          retention-days: 14
          if-no-files-found: ignore
